# Nightly end-to-end validation for HydroComplete (OCS automation + Playwright + Civil 3D).
#
# Limitations on GitHub-hosted windows-latest:
#   - Open CAD Studio portable is downloaded each run (cached).
#   - Civil 3D / AutoCAD 2026 is NOT installed — dotnet net8 plugin build and GUI smoke skip or fail gracefully.
#   - 24-145 DWG workflow is optional (skipped when fixture DWG is absent).
#
# Civil 3D GUI parity smoke requires a self-hosted Windows runner with AutoCAD 2026:
#   runs-on: [self-hosted, windows, civil3d]
#   See hydrocomplete-civil3d/scripts/setup-self-hosted-runner.md
#
# Manual trigger: Actions → "E2E Nightly" → Run workflow
#   - run_civil3d_gui: enable to queue civil3d-gui-smoke on a self-hosted runner.

name: E2E Nightly

on:
  schedule:
    # 09:00 UTC daily
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      run_civil3d_gui:
        description: 'Run Civil 3D GUI parity smoke (self-hosted runner with AutoCAD 2026)'
        type: boolean
        default: false
      e2e_mode:
        description: 'OCS suite mode (OcsFrontend = nightly default; Full = attempt everything)'
        type: choice
        options:
          - OcsFrontend
          - Full
        default: OcsFrontend

# The OCS release under test and the rustc the plugin is built with are read
# from ocs-host.lock by .github/actions/host-toolchain, which exports
# OCS_VERSION and OCS_EXE_NAME. Repinning the lock moves this job with it.

jobs:
  ocs-e2e-frontend:
    name: OCS E2E + Playwright
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout hydrocomplete-dag
        uses: actions/checkout@v4
        with:
          repository: mf4633/hydrocomplete-dag
          ref: master
          path: _dag
          token: ${{ secrets.GITHUB_TOKEN }}

      # rustc and the OCS tag both come from ocs-host.lock (see the action).
      - name: Install the host's rustc
        uses: ./.github/actions/host-toolchain

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Cache OCS portable
        uses: actions/cache@v4
        id: ocs-cache
        with:
          path: ${{ runner.temp }}/${{ env.OCS_EXE_NAME }}
          key: ocs-portable-${{ env.OCS_VERSION }}-windows-x86_64

      - name: Download Open CAD Studio portable
        if: steps.ocs-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $tag = $env:OCS_VERSION
          $asset = "OpenCADStudio-$tag-windows-x86_64-portable.exe"
          $url = "https://github.com/HakanSeven12/OpenCADStudio/releases/download/$tag/$asset"
          $dest = Join-Path $env:RUNNER_TEMP $asset
          Write-Host "Downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $dest -UseBasicParsing
          if (-not (Test-Path $dest)) { throw "OCS download failed: $dest" }
          Write-Host "OCS portable: $dest ($((Get-Item $dest).Length) bytes)"

      # The OCS steps hung on hosted runners with no output (2026-09-12, run
      # 34721475211: 26 min inside the first --serve call). Probe the host alone
      # with a hard cap so a hang is diagnosed in seconds, not at job timeout.
      - name: Probe OCS --serve (no plugins, 90 s cap)
        shell: pwsh
        timeout-minutes: 5
        continue-on-error: true
        run: |
          $exe = Join-Path $env:RUNNER_TEMP $env:OCS_EXE_NAME
          Get-Item $exe | Format-List Name, Length
          $psi = New-Object System.Diagnostics.ProcessStartInfo $exe, '--serve'
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $psi.Environment['OCS_PLUGINS_DIR'] = (Join-Path $env:RUNNER_TEMP 'no-plugins')
          $psi.Environment['OCS_PLUGIN_VERBOSE'] = '1'
          $p = [System.Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          $p.StandardInput.WriteLine('{"op":"new"}')
          $p.StandardInput.WriteLine('{"op":"entities"}')
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(90000)) { Write-Host '::warning::OCS --serve HUNG (90 s) with no plugins'; $p.Kill() }
          $p.WaitForExit()
          Write-Host "exit code: $($p.ExitCode)"
          Write-Host "--- stdout"; Write-Host $out.Result
          Write-Host "--- stderr"; Write-Host $err.Result

      # Same probe with the plugin loaded (verbose IPC trace, 120 s cap). The
      # suite hung 22 min inside its first --serve call once the plugin
      # started loading (run 40103256297); this shows where it stops.
      - name: Probe OCS --serve with the plugin (120 s cap)
        shell: pwsh
        timeout-minutes: 8
        continue-on-error: true
        run: |
          cargo build --release -p opencad-hydrocomplete-plugin
          $dir = Join-Path $env:RUNNER_TEMP 'probe-plugins\opencad.hydrocomplete'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          Copy-Item target\release\opencad_hydrocomplete_plugin.dll (Join-Path $dir 'opencad.hydrocomplete-windows-x86_64.dll')
          $acad = ((Select-String -Path Cargo.lock -Pattern '^source = "git\+https://github.com/HakanSeven12/opencadcodec.git' | Select-Object -First 1).Line -replace '^source = "', '' -replace '"$', '')
          $toml = (Get-Content -Raw plugin.toml).Replace('__RUSTC_VERSION__', (rustc --version).Trim()).Replace('__ACADRUST_SOURCE__', $acad)
          [IO.File]::WriteAllText((Join-Path $dir 'plugin.toml'), $toml, (New-Object Text.UTF8Encoding $false))
          $exe = Join-Path $env:RUNNER_TEMP $env:OCS_EXE_NAME
          $psi = New-Object System.Diagnostics.ProcessStartInfo $exe, '--serve'
          $psi.RedirectStandardInput = $true
          $psi.RedirectStandardOutput = $true
          $psi.RedirectStandardError = $true
          $psi.UseShellExecute = $false
          $psi.Environment['OCS_PLUGINS_DIR'] = (Join-Path $env:RUNNER_TEMP 'probe-plugins')
          $psi.Environment['OCS_PLUGIN_VERBOSE'] = '1'
          $sw = [Diagnostics.Stopwatch]::StartNew()
          $p = [System.Diagnostics.Process]::Start($psi)
          $out = $p.StandardOutput.ReadToEndAsync()
          $err = $p.StandardError.ReadToEndAsync()
          $p.StandardInput.WriteLine('{"op":"new"}')
          $p.StandardInput.WriteLine('{"op":"run","cmd":"HC_ABOUT"}')
          $p.StandardInput.WriteLine('{"op":"entities"}')
          $p.StandardInput.Close()
          if (-not $p.WaitForExit(120000)) {
            Write-Host '::warning::OCS --serve HUNG (120 s) with the plugin loaded'
            Get-CimInstance Win32_Process | Where-Object { $_.Name -like 'OpenCADStudio*' } | Format-Table ProcessId, ParentProcessId, CommandLine -AutoSize | Out-String -Width 400 | Write-Host
            Get-Process | Where-Object { $_.Name -like 'OpenCADStudio*' } | Stop-Process -Force
          }
          Write-Host ("elapsed {0:n1}s, exit code: {1}" -f $sw.Elapsed.TotalSeconds, $(if ($p.HasExited) { $p.ExitCode } else { 'killed' }))
          if ($out.Wait(5000)) { Write-Host "--- stdout"; Write-Host $out.Result }
          if ($err.Wait(5000)) { Write-Host "--- stderr"; Write-Host $err.Result }

      - name: Run nightly E2E (OCS + frontend)
        shell: pwsh
        timeout-minutes: 25
        env:
          HC_OCS_EXE: ${{ runner.temp }}/${{ env.OCS_EXE_NAME }}
          E2E_MODE: ${{ github.event.inputs.e2e_mode || 'OcsFrontend' }}
        run: ./scripts/run_nightly_e2e.ps1 -Mode $env:E2E_MODE

  civil3d-dotnet:
    name: Civil 3D dotnet CI
    runs-on: windows-latest
    timeout-minutes: 60
    # The net8.0-windows target needs Autodesk's AcMgd.dll, which hosted runners
    # do not carry (scripts/ci.ps1 therefore always failed here). Run what a
    # hosted runner CAN prove, mirroring hydrocomplete-civil3d's own CI: engine
    # unit tests + the net48 compile against the NuGet API stubs. The full net8
    # build belongs to the self-hosted civil3d-gui-smoke job.

    steps:
      - name: Checkout hydrocomplete-civil3d
        uses: actions/checkout@v4
        with:
          repository: mf4633/hydrocomplete-civil3d
          ref: master
          path: hydrocomplete-civil3d
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            7.0.x

      - name: Engine unit tests
        working-directory: hydrocomplete-civil3d
        run: dotnet test tests/HydroComplete.Engine.Tests/HydroComplete.Engine.Tests.csproj -c Release

      - name: Civil 3D plugin (net48 offline compile)
        shell: pwsh
        working-directory: hydrocomplete-civil3d
        run: >
          dotnet build src/HydroComplete.Civil3D/HydroComplete.Civil3D.csproj
          -c Release -p:BuildNet48=true -f net48

  civil3d-gui-smoke:
    name: Civil 3D GUI parity smoke
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.run_civil3d_gui == 'true' }}
    runs-on: [self-hosted, windows, civil3d]
    timeout-minutes: 45
    # Hosted runners lack AutoCAD; this job is dispatch-only on a labeled self-hosted runner.
    continue-on-error: true

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4

      - name: Checkout hydrocomplete-civil3d (sibling path)
        uses: actions/checkout@v4
        with:
          repository: mf4633/hydrocomplete-civil3d
          ref: master
          path: ../hydrocomplete-civil3d
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify AutoCAD 2026
        shell: pwsh
        run: |
          $acad = 'C:\Program Files\Autodesk\AutoCAD 2026\acad.exe'
          if (-not (Test-Path $acad)) {
            Write-Host '::warning::AutoCAD 2026 not found — GUI smoke will SKIP. Install Civil 3D / AutoCAD 2026 on this runner.'
          } else {
            Write-Host "AutoCAD 2026: $acad"
          }

      - name: Run Civil 3D GUI E2E smoke
        shell: pwsh
        env:
          HC_CIVIL3D_ROOT: ${{ github.workspace }}/../hydrocomplete-civil3d
        run: ./scripts/run_nightly_e2e.ps1 -Mode Civil3dGui