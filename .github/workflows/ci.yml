# PR/push CI: fast Rust + Playwright only. Full OCS + Civil 3D nightly: .github/workflows/e2e-nightly.yml
name: ci

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  rust-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # rustc and the OCS tag both come from ocs-host.lock (see the action).
      - name: Install the host's rustc
        uses: ./.github/actions/host-toolchain
      - run: cargo test --workspace --all-features
      - run: cargo build --release -p opencad-hydrocomplete-plugin

  windows-e2e:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: mf4633/hydrocomplete-dag
          ref: master
          path: _dag
          token: ${{ secrets.GITHUB_TOKEN }}

      # rustc and the OCS tag both come from ocs-host.lock (see the action).
      - name: Install the host's rustc
        uses: ./.github/actions/host-toolchain
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Rust + Playwright CI tests
        shell: pwsh
        run: ./scripts/run_ci_tests.ps1