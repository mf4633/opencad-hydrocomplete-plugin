name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: so
            asset: opencad.hydrocomplete-linux-x86_64.so
          - os: windows-latest
            ext: dll
            asset: opencad.hydrocomplete-windows-x86_64.dll
          - os: macos-latest
            ext: dylib
            asset: opencad.hydrocomplete-macos-aarch64.dylib
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # rustc and the OCS tag both come from ocs-host.lock (see the action).
      - name: Install the host's rustc
        uses: ./.github/actions/host-toolchain
      - run: cargo build --release
      - name: Stage release asset
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/*.${{ matrix.ext }} "dist/${{ matrix.asset }}"
          # Fill in the fingerprint the host checks (API >= 4): the compiler and
          # the opencadcodec source actually resolved in Cargo.lock.
          acad=$(grep -m1 '^source = "git+https://github.com/HakanSeven12/opencadcodec.git' Cargo.lock | sed 's/^source = "//; s/"$//')
          [ -n "$acad" ] || { echo "::error::no opencadcodec source in Cargo.lock"; exit 1; }
          sed -e "s|__RUSTC_VERSION__|$(rustc --version)|" -e "s|__ACADRUST_SOURCE__|$acad|" plugin.toml > dist/plugin.toml
          grep -E 'rustc_version|acadrust_source' dist/plugin.toml
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/${{ matrix.asset }}
            dist/plugin.toml