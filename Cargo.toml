[workspace]
members = [".", "crates/stormsewer", "crates/hydrocomplete"]
resolver = "2"

[package]
name = "opencad-hydrocomplete-plugin"
version = "0.4.11"
edition = "2021"
description = "HydroComplete hydrology/hydraulics add-on for Open CAD Studio — external cdylib plugin."
license = "GPL-3.0-only"

[lib]
crate-type = ["cdylib"]
name = "opencad_hydrocomplete_plugin"

[dependencies]
ocs_plugin_api = { git = "https://github.com/HakanSeven12/OpenCADStudio", rev = "23d9a261b14b0d3799397e6e466332f82d9ab43a", features = ["host"] }
acadrust = "0.4.1"
stormsewer = { path = "crates/stormsewer" }
hydrocomplete = { path = "crates/hydrocomplete" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"